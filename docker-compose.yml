version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: schedule_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: schedule_secure_password
      POSTGRES_DB: schedule_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Discord Bot Application
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schedule_discord_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:schedule_secure_password@postgres:5432/schedule_manager?schema=public"
      DEFAULT_TIMEZONE: "Asia/Ho_Chi_Minh"
      PORT: 3000
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
